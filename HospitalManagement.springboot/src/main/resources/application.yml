server:
  ip: http://localhost:7245 
  tomcat: #tomact 服务器的配置
    relaxed-query-chars: '|,{,},[,]'  #进行get请求到时候 如何参数包含[,{,},] 认为是正常的
  port: 7245 # 端口
#数据库名：mysql，用户名root，密码123456
spring:
  application:
    admin:
      enabled: false # 禁用 SpringApplicationAdmin 以避免 JMX MBean 冲突
  web:
    resources:
      add-mappings: true # 启用静态资源映射
  servlet:
    multipart: #文件的上传配置
    max-request-size: 10000MB #请求的最大报文长度不能超过10000MB
    max-file-size: 10024MB #上传的文件最大不能超过10024MB
  datasource: #数据库的配置
    username: root #数据库的账号
    password: 123456 #数据库的密码
    url: jdbc:mysql://localhost:3306/hospital_bed_reservation?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  jackson: # json序列号配置
    property-naming-strategy: UPPER_CAMEL_CASE #设置大写开头的命名风格
    date-format: yyyy-MM-dd HH:mm:ss #设置标准的时间格式
    time-zone: Asia/Shanghai #时间对于的时区
  data:
    redis: # Redis配置
      host: localhost # Redis服务器地址
      port: 6379 # Redis服务器端口
      password: # Redis密码，如果没有密码则留空
      database: 0 # 使用的数据库索引（0-15）
      timeout: 3000ms # 连接超时时间
      lettuce: # 使用Lettuce连接池
        pool:
          max-active: 8 # 最大连接数
          max-idle: 8 # 最大空闲连接数
          min-idle: 0 # 最小空闲连接数
          max-wait: -1ms # 最大等待时间

mybatis-plus: #操作数据库的ORM框架 mybatis
  mapper-locations: mapper/*.xml #配置对于的mapper文件位置
  global-config: #mybatis的全局配置
    db-config: #数据库的配置
      table-prefix:   #表前面是否加前缀  如果不配置为空 会导致查询的sql表前面带有特定 前缀
  configuration:
    #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: false         #是否转换成大小写
  type-aliases-package: com.example.web.entity  #实体存储的包位置
